<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbar vs Rural: Population Projection vs Aadhaar Activity (2025)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --proj-color: #38bdf8; /* Sky 400 */
            --act-color: #f472b6;  /* Pink 400 */
            --connector: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            padding: 40px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: flex-end;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }

        /* Chart */
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
            height: 40px;
        }

        .label {
            width: 180px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .chart-area {
            flex-grow: 1;
            position: relative;
            height: 100%;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .connector-line {
            position: absolute;
            top: 50%;
            height: 2px;
            background: var(--connector);
            transform: translateY(-50%);
            opacity: 0.5;
        }

        .marker {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .marker:hover {
            transform: translate(-50%, -50%) scale(1.5);
            z-index: 10;
        }

        .proj-marker { background: var(--proj-color); box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        .act-marker { background: var(--act-color); box-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .grid-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 1px;
            background: rgba(255,255,255,0.05);
        }
        
        .grid-label {
            position: absolute;
            bottom: -20px;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--connector);
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Projected Demographics vs. Digital Reality (2025)</h1>
    <div class="subtitle">Comparing Urban Population Percentage (Projected) with Actual Aadhaar Urban Activity.</div>

    <div class="legend">
        <div class="legend-item">
            <div class="dot" style="background: var(--proj-color)"></div>
            <span>Projected Urban Pop %</span>
        </div>
        <div class="legend-item">
            <div class="dot" style="background: var(--act-color)"></div>
            <span>Actual Aadhaar Urban Activity %</span>
        </div>
    </div>

    <div id="chart"></div>
</div>
<div id="tooltip"></div>

<script>
    const data = [{"state": "Bihar", "urban_pop": 12.44, "rural_pop": 87.56, "urban_act": 92.08, "rural_act": 7.92}, {"state": "Chhattisgarh", "urban_pop": 27.76, "rural_pop": 72.24, "urban_act": 93.88, "rural_act": 6.12}, {"state": "Sikkim", "urban_pop": 77.89, "rural_pop": 22.11, "urban_act": 14.56, "rural_act": 85.44}, {"state": "Uttar Pradesh", "urban_pop": 24.31, "rural_pop": 75.69, "urban_act": 86.45, "rural_act": 13.55}, {"state": "Meghalaya", "urban_pop": 20.74, "rural_pop": 79.26, "urban_act": 82.13, "rural_act": 17.87}, {"state": "Jharkh&", "urban_pop": 26.52, "rural_pop": 73.48, "urban_act": 83.34, "rural_act": 16.66}, {"state": "Madhya Pradesh", "urban_pop": 29.21, "rural_pop": 70.79, "urban_act": 81.89, "rural_act": 18.11}, {"state": "Manipur", "urban_pop": 32.97, "rural_pop": 67.03, "urban_act": 84.32, "rural_act": 15.68}, {"state": "Kerala", "urban_pop": 54.57, "rural_pop": 45.43, "urban_act": 6.65, "rural_act": 93.35}, {"state": "Pondicherry", "urban_pop": 70.47, "rural_pop": 29.53, "urban_act": 23.94, "rural_act": 76.06}, {"state": "Assam", "urban_pop": 15.8, "rural_pop": 84.2, "urban_act": 60.75, "rural_act": 39.25}, {"state": "Rajasthan", "urban_pop": 26.9, "rural_pop": 73.1, "urban_act": 69.97, "rural_act": 30.03}, {"state": "West Bengal", "urban_pop": 37.63, "rural_pop": 62.37, "urban_act": 79.23, "rural_act": 20.77}, {"state": "Haryana", "urban_pop": 43.26, "rural_pop": 56.74, "urban_act": 81.54, "rural_act": 18.46}, {"state": "Mizoram", "urban_pop": 55.52, "rural_pop": 44.48, "urban_act": 20.85, "rural_act": 79.15}, {"state": "Jammu & Kashmir", "urban_pop": 31.05, "rural_pop": 68.95, "urban_act": 60.8, "rural_act": 39.2}, {"state": "Maharashtra", "urban_pop": 49.07, "rural_pop": 50.93, "urban_act": 77.81, "rural_act": 22.19}, {"state": "Nagal&", "urban_pop": 48.69, "rural_pop": 51.31, "urban_act": 21.76, "rural_act": 78.24}, {"state": "Tamil Nadu", "urban_pop": 53.16, "rural_pop": 46.84, "urban_act": 31.66, "rural_act": 68.34}, {"state": "Punjab", "urban_pop": 42.55, "rural_pop": 57.45, "urban_act": 60.55, "rural_act": 39.45}, {"state": "Dadra & Nagar Haveli", "urban_pop": 96.66, "rural_pop": 3.34, "urban_act": 78.71, "rural_act": 21.29}, {"state": "&Hra Pradesh", "urban_pop": 37.69, "rural_pop": 62.31, "urban_act": 53.96, "rural_act": 46.04}, {"state": "Ch&Igarh", "urban_pop": 100.0, "rural_pop": 0.0, "urban_act": 86.25, "rural_act": 13.75}, {"state": "Gujarat", "urban_pop": 49.71, "rural_pop": 50.29, "urban_act": 61.55, "rural_act": 38.45}, {"state": "Goa", "urban_pop": 79.42, "rural_pop": 20.58, "urban_act": 68.0, "rural_act": 32.0}, {"state": "Lakshadweep", "urban_pop": 99.63, "rural_pop": 0.37, "urban_act": 89.0, "rural_act": 11.0}, {"state": "Arunachal Pradesh", "urban_pop": 26.1, "rural_pop": 73.9, "urban_act": 18.0, "rural_act": 82.0}, {"state": "Himachal Pradesh", "urban_pop": 10.35, "rural_pop": 89.65, "urban_act": 8.05, "rural_act": 91.95}, {"state": "Tripura", "urban_pop": 41.45, "rural_pop": 58.55, "urban_act": 43.31, "rural_act": 56.69}, {"state": "Odisha", "urban_pop": 19.19, "rural_pop": 80.81, "urban_act": 21.03, "rural_act": 78.97}, {"state": "&Aman & Nicobar Isl&S", "urban_pop": 45.18, "rural_pop": 54.82, "urban_act": 47.0, "rural_act": 53.0}, {"state": "Karnataka", "urban_pop": 45.37, "rural_pop": 54.63, "urban_act": 46.48, "rural_act": 53.52}, {"state": "Delhi", "urban_pop": 99.73, "rural_pop": 0.27, "urban_act": 100.0, "rural_act": 0.0}];

    const chart = document.getElementById('chart');
    const tooltip = document.getElementById('tooltip');

    data.forEach(d => {
        const row = document.createElement('div');
        row.className = 'row';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = d.state;
        row.appendChild(label);

        const area = document.createElement('div');
        area.className = 'chart-area';

        // Draw scale
        // 0 to 100%
        
        const p1 = d.urban_pop;
        const p2 = d.urban_act;
        
        const minP = Math.min(p1, p2);
        const maxP = Math.max(p1, p2);
        const width = maxP - minP;

        // Connector
        const line = document.createElement('div');
        line.className = 'connector-line';
        line.style.left = minP + '%';
        line.style.width = width + '%';
        // Color line based on divergence?
        // If Act > Proj -> Pinkish
        // If Proj > Act -> Blueish
        line.style.background = (p2 > p1) ? 'linear-gradient(90deg, var(--proj-color), var(--act-color))' : 'linear-gradient(90deg, var(--act-color), var(--proj-color))';
        
        area.appendChild(line);

        // Marker 1 (Proj)
        const m1 = document.createElement('div');
        m1.className = 'marker proj-marker';
        m1.style.left = p1 + '%';
        m1.onmousemove = (e) => showTooltip(e, `Projected Urban Pop: ${p1.toFixed(1)}%`);
        m1.onmouseleave = hideTooltip;
        area.appendChild(m1);

        // Marker 2 (Act)
        const m2 = document.createElement('div');
        m2.className = 'marker act-marker';
        m2.style.left = p2 + '%';
        m2.onmousemove = (e) => showTooltip(e, `Aadhaar Urban Activity: ${p2.toFixed(1)}%<br>Rural Activity: ${(100-p2).toFixed(1)}%`);
        m2.onmouseleave = hideTooltip;
        area.appendChild(m2);

        row.appendChild(area);
        chart.appendChild(row);
    });

    // Add Grid lines
    // Just visual hints at 25, 50, 75
    // Need to overlay on chart area... simpler to just assume fixed width?
    // Let's add a grid container behind rows.
    
    function showTooltip(e, html) {
        tooltip.innerHTML = html;
        tooltip.style.opacity = 1;
        tooltip.style.left = (e.pageX + 10) + 'px';
        tooltip.style.top = (e.pageY - 10) + 'px';
    }

    function hideTooltip() {
        tooltip.style.opacity = 0;
    }

</script>
</body>
</html>
