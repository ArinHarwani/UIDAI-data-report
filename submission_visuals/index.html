<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Enrollment Heatmap</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <div class="glass-panel">
        <h1>India Enrollment</h1>
        <div class="controls">
            <div class="control-group">
                <label for="monthSelect">Month & Year</label>
                <select id="monthSelect"></select>
            </div>

            <div class="control-group">
                <label for="ageSelect">Age Group</label>
                <select id="ageSelect">
                    <option value="age_0_5">Age 0-5</option>
                    <option value="age_5_17">Age 5-17</option>
                    <option value="age_18_greater">Age 18+</option>
                </select>
            </div>
        </div>
        <div id="stats" class="stats">
            <p>Select filters to view data.</p>
        </div>
    </div>

    <div class="legend" id="legend"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Data Scripts -->
    <script src="india_geo.js"></script>
    <script src="data.js"></script>

    <!-- Main Script -->
    <script src="script.js"></script>
</body>

</html>
