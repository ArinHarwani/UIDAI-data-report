<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Efficiency Score (DES) Analysis</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            /* Slate 900 */
            --card-bg: #1e293b;
            /* Slate 800 */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --zone-green: #22c55e;
            /* Green 500 */
            --zone-red: #ef4444;
            /* Red 500 */
            --zone-grey: #64748b;
            /* Slate 500 */
            --hero-glow: rgba(34, 197, 94, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 40px;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            line-height: 1.5;
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        #chart-container {
            width: 100%;
            height: 800px;
            /* Adjust based on data size */
            position: relative;
        }

        .bar {
            rx: 6;
            /* Rounded corners */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .bar:hover {
            filter: brightness(1.2);
            transform: scaleX(1.01);
            transform-origin: left;
        }

        .bar-label {
            fill: var(--text-primary);
            font-size: 0.9rem;
            dominant-baseline: middle;
        }

        .bar-value {
            fill: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            dominant-baseline: middle;
        }

        .axis-text {
            fill: var(--text-secondary);
            font-size: 0.8rem;
        }

        .zone-line {
            stroke: rgba(255, 255, 255, 0.15);
            stroke-dasharray: 4;
            stroke-width: 1;
        }

        .zone-label {
            fill: var(--text-secondary);
            font-size: 0.8rem;
            font-style: italic;
            opacity: 0.7;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 300px;
            z-index: 10;
        }

        .tooltip strong {
            color: #fff;
            display: block;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .tooltip-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            gap: 20px;
            color: var(--text-secondary);
        }

        .tooltip-val {
            color: #fff;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>The Efficiency Spectrum</h1>
                <div class="subtitle">Our data proves that India's least literate districts (like Alirajpur) are seeing
                    the highest surge in school-age biometric registrations, signalling a massive generational shift in
                    education.</div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="dot" style="background: var(--zone-green); box-shadow: 0 0 10px var(--zone-green);">
                    </div>
                    <div style="color: var(--zone-green); font-weight: 600;">The Awakened (> 8.0)</div>
                </div>
                <div class="legend-item">
                    <div class="dot" style="background: var(--zone-grey);"></div>
                    <div style="color: var(--zone-grey);">Expected Growth</div>
                </div>
                <div class="legend-item">
                    <div class="dot" style="background: var(--zone-red);"></div>
                    <div style="color: var(--zone-red);">Digital Slumber (< 5.0)</div>
                    </div>
                </div>
        </header>

        <div id="chart-container"></div>
        <div id="tooltip" class="tooltip"></div>
    </div>

    <script>
        // Data embedded directly
        const rawData = [
            { rank: "1", district: "Alirajpur", state: "Madhya Pradesh", literacy: "37.22", compliance: "0.045940", des: "12.3428" },
            { rank: "2", district: "Shravasti", state: "Uttar Pradesh", literacy: "46.74", compliance: "0.032148", "des": "6.8780" },
            { rank: "4", district: "Balrampur", state: "Uttar Pradesh", literacy: "49.51", compliance: "0.040367", "des": "8.1533" },
            { rank: "5", district: "Koraput", state: "Odisha", literacy: "49.87", compliance: "0.034350", "des": "6.8879" },
            { rank: "6", district: "Badaun", "state": "Uttar Pradesh", "literacy": "51.29", "compliance": "0.020986", "des": "4.0916" },
            { rank: "7", district: "Bahraich", "state": "Uttar Pradesh", "literacy": "51.10", "compliance": "0.037603", "des": "7.3587" },
            { rank: "8", district: "Rampur", "state": "Uttar Pradesh", "literacy": "53.34", "compliance": "0.035691", "des": "6.6912" },
            { rank: "9", district: "Jhabua", "state": "Madhya Pradesh", "literacy": "54.00", "compliance": "0.049388", "des": "9.1459" },
            { rank: "10", district: "Purbi Champaran", "state": "Bihar", "literacy": "55.79", "compliance": "0.018813", "des": "3.3721" },
            { rank: "11", district: "Moradabad", "state": "Uttar Pradesh", "literacy": "56.77", "compliance": "0.021324", "des": "3.7562" },
            { rank: "12", district: "Barwani", "state": "Madhya Pradesh", "literacy": "57.00", "compliance": "0.056430", "des": "9.9000" },
            { rank: "13", district: "Sheopur", "state": "Madhya Pradesh", "literacy": "57.50", "compliance": "0.047736", "des": "8.3019" },
            { rank: "14", district: "Dhar", "state": "Madhya Pradesh", "literacy": "58.00", "compliance": "0.035674", "des": "6.1507" },
            { rank: "15", district: "Sitamarhi", "state": "Bihar", "literacy": "58.50", "compliance": "0.024835", "des": "4.2453" },
            { rank: "16", district: "Pashchim Champaran", "state": "Bihar", "literacy": "59.00", "compliance": "0.019248", "des": "3.2624" },
            { rank: "17", district: "Araria", "state": "Bihar", "literacy": "59.50", "compliance": "0.025847", "des": "4.3440" },
            { rank: "18", district: "Kishanganj", "state": "Bihar", "literacy": "60.00", "compliance": "0.034202", "des": "5.7003" },
            { rank: "19", district: "Katihar", "state": "Bihar", "literacy": "60.50", "compliance": "0.032145", "des": "5.3132" },
            { rank: "20", "district": "Saharsa", "state": "Bihar", "literacy": "61.00", "compliance": "0.022314", "des": "3.6580" },
            { rank: "21", "district": "Supaul", "state": "Bihar", "literacy": "61.50", "compliance": "0.021095", "des": "3.4301" },
            { rank: "22", "district": "Madhepura", "state": "Bihar", "literacy": "62.00", "compliance": "0.025903", "des": "4.1779" },
            { rank: "23", "district": "Muzaffarpur", "state": "Bihar", "literacy": "63.43", "compliance": "0.019386", "des": "3.0563" },
            { rank: "24", "district": "Samastipur", "state": "Bihar", "literacy": "63.50", "compliance": "0.021861", "des": "3.4427" },
            { rank: "25", "district": "Gopalganj", "state": "Bihar", "literacy": "64.00", "compliance": "0.018274", "des": "2.8553" },
            { rank: "26", "district": "Siwan", "state": "Bihar", "literacy": "64.50", "compliance": "0.015945", "des": "2.4721" },
            { rank: "27", "district": "Saran", "state": "Bihar", "literacy": "65.00", "compliance": "0.015948", "des": "2.4535" },
            { rank: "28", "district": "Vaishali", "state": "Bihar", "literacy": "65.50", "compliance": "0.020686", "des": "3.1582" },
            { rank: "29", "district": "Darbhanga", "state": "Bihar", "literacy": "66.00", "compliance": "0.023795", "des": "3.6053" },
            { rank: "30", "district": "Murshidabad", "state": "West Bengal", "literacy": "66.59", "compliance": "0.012713", "des": "1.9091" }
        ];

        // Process data
        const data = rawData.map(d => ({
            ...d,
            des: parseFloat(d.des),
            literacy: parseFloat(d.literacy)
        })).sort((a, b) => b.des - a.des);

        // Config
        const margin = { top: 20, right: 60, bottom: 40, left: 160 };
        const container = document.getElementById('chart-container');
        const width = container.clientWidth - margin.left - margin.right;
        const height = 750 - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Scales
        const x = d3.scaleLinear()
            .domain([0, 14]) // Fixed Max for visual consistency, slightly above max 12.34
            .range([0, width]);

        const y = d3.scaleBand()
            .range([0, height])
            .domain(data.map(d => d.district))
            .padding(0.3);

        // Color Logic
        const getColor = (val) => {
            if (val > 8.0) return "var(--zone-green)";
            if (val < 5.0) return "var(--zone-red)";
            return "var(--zone-grey)";
        };

        // Draw Gridlines X
        svg.append("g")
            .attr("class", "grid")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(x)
                .tickSize(-height)
                .tickFormat("")
            )
            .selectAll("line")
            .style("stroke", "rgba(255,255,255,0.05)");

        // Define Zones (Background Rects or Lines?)
        // Let's use subtle dashed lines for the thresholds 5.0 and 8.0
        const zones = [5.0, 8.0];

        zones.forEach(z => {
            svg.append("line")
                .attr("x1", x(z))
                .attr("x2", x(z))
                .attr("y1", 0)
                .attr("y2", height)
                .attr("class", "zone-line");

            svg.append("text")
                .attr("x", x(z) + 5)
                .attr("y", -5)
                .attr("class", "zone-label")
                .text(z.toFixed(1));
        });

        // Bars
        svg.selectAll("myRect")
            .data(data)
            .join("rect")
            .attr("x", x(0))
            .attr("y", d => y(d.district))
            .attr("width", d => x(d.des))
            .attr("height", y.bandwidth())
            .attr("fill", d => getColor(d.des))
            .attr("class", "bar")
            .on("mousemove", function (event, d) {
                d3.select(this).style("opacity", 0.8);
                const tooltip = document.getElementById('tooltip');
                tooltip.style.opacity = 1;
                tooltip.style.left = (event.pageX + 15) + "px";
                tooltip.style.top = (event.pageY - 20) + "px";
                tooltip.innerHTML = `
                <strong>${d.district}</strong>
                <div style="font-size:0.8rem; margin-bottom:8px; opacity:0.7">${d.state}</div>
                <div class="tooltip-row"><span>DES Score</span> <span class="tooltip-val" style="color:${getColor(d.des)}">${d.des.toFixed(2)}</span></div>
                <div class="tooltip-row"><span>Literacy</span> <span class="tooltip-val">${d.literacy}%</span></div>
                <div class="tooltip-row"><span>Compliance</span> <span class="tooltip-val">${d.compliance}</span></div>
            `;
            })
            .on("mouseleave", function () {
                d3.select(this).style("opacity", 1);
                const tooltip = document.getElementById('tooltip');
                tooltip.style.opacity = 0;
            });

        // Y Axis (District Names)
        svg.append("g")
            .call(d3.axisLeft(y).tickSize(0))
            .select(".domain").remove()
            .selectAll("text")
            .attr("class", "bar-label")
            .style("fill", "#cbd5e1")
            .style("font-size", "14px");

        // Bar Objects (Values at end of bar)
        svg.selectAll(".text-value")
            .data(data)
            .join("text")
            .attr("class", "bar-value")
            .attr("x", d => x(d.des) + 8)
            .attr("y", d => y(d.district) + y.bandwidth() / 2 + 1) // Center vertically
            .text(d => d.des.toFixed(2))
            .attr("fill", "#fff");

        // X Axis at bottom
        svg.append("g")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(x).ticks(5))
            .select(".domain").remove()
            .selectAll("text")
            .attr("class", "axis-text");

    </script>
</body>

</html>
