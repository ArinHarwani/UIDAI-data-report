<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbar vs Rural: Stacked Comparison (2025)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            --proj-urban: #10b981; /* Emerald 500 */
            --proj-rural: #334155; /* Slate 700 */
            
            --act-urban: #3b82f6;  /* Blue 500 */
            --act-rural: #1e293b;  /* Slate 800 - darker */
            
            --gap-pos: #22c55e;
            --gap-neg: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0; padding: 40px;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 1200px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            padding: 40px;
        }

        h1 {
             font-size: 2rem; margin-bottom: 10px;
             color: #fff;
        }
        
        .subtitle {
            color: var(--text-secondary); margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .legend {
            display: flex; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px;
        }
        .legend-group { display: flex; gap: 10px; align-items: center; }
        .box { width: 16px; height: 16px; border-radius: 4px; }

        .row {
            display: grid;
            grid-template-columns: 200px 1fr 80px; /* Name | Bars | Gap Val */
            gap: 20px;
            margin-bottom: 24px;
            align-items: center;
        }

        .state-name { font-weight: 600; font-size: 1rem; color: #e2e8f0; }

        .bars-container {
            display: flex; flex-direction: column; gap: 4px;
            position: relative;
        }

        /* Bar styles */
        .bar-wrapper {
            display: flex; width: 100%; height: 24px;
            border-radius: 4px; overflow: hidden;
            position: relative;
        }
        
        .segment {
            height: 100%;
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 8px; font-size: 0.75rem; font-weight: 600;
            transition: width 0.5s ease-out;
        }

        .proj .urban { background-color: var(--proj-urban); color: #064e3b; }
        .proj .rural { background-color: var(--proj-rural); }
        
        .act .urban { background-color: var(--act-urban); color: #1e3a8a; }
        .act .rural { background-color: var(--act-rural); }

        .label-tag {
            font-size: 0.7rem; color: var(--text-secondary);
            position: absolute; left: -60px; top: 4px; width: 50px; text-align: right;
        }

        .gap-val {
            font-weight: 700; font-size: 1rem; text-align: right;
        }
        .gap-pos { color: var(--gap-pos); }
        .gap-neg { color: var(--gap-neg); }

    </style>
</head>
<body>

<div class="container">
    <h1>Expected vs. Reality: Urbanization</h1>
    <div class="subtitle">Comparing <strong>Projected Urban Share (2025)</strong> with <strong>Actual Aadhaar Urban Activity</strong>. <br> Positive values indicate higher-than-expected urban digital activity.</div>

    <div class="legend">
        <div class="legend-group">
            <div class="box" style="background: var(--proj-urban)"></div>
            <span>Target (Projected Urban)</span>
        </div>
        <div class="legend-group">
            <div class="box" style="background: var(--act-urban)"></div>
            <span>Actual (Aadhaar Urban)</span>
        </div>
        <div class="legend-group">
            <div class="box" style="background: var(--proj-rural)"></div>
            <span>Rural Share</span>
        </div>
    </div>

    <div id="chart"></div>
</div>

<script>
    const data = [{"state": "Bihar", "urban_pop": 12.44, "rural_pop": 87.56, "urban_act": 92.08, "rural_act": 7.92, "gap": 79.64}, {"state": "Chhattisgarh", "urban_pop": 27.76, "rural_pop": 72.24, "urban_act": 93.88, "rural_act": 6.12, "gap": 66.11999999999999}, {"state": "Uttar Pradesh", "urban_pop": 24.31, "rural_pop": 75.69, "urban_act": 86.45, "rural_act": 13.55, "gap": 62.14}, {"state": "Meghalaya", "urban_pop": 20.74, "rural_pop": 79.26, "urban_act": 82.13, "rural_act": 17.87, "gap": 61.39}, {"state": "Jharkhand", "urban_pop": 26.52, "rural_pop": 73.48, "urban_act": 83.34, "rural_act": 16.66, "gap": 56.82000000000001}, {"state": "Madhya Pradesh", "urban_pop": 29.21, "rural_pop": 70.79, "urban_act": 81.89, "rural_act": 18.11, "gap": 52.68}, {"state": "Andaman & Nicobar Islands", "urban_pop": 99.63, "rural_pop": 0.37, "urban_act": 47.0, "rural_act": 53.0, "gap": -52.629999999999995}, {"state": "Manipur", "urban_pop": 32.97, "rural_pop": 67.03, "urban_act": 84.32, "rural_act": 15.68, "gap": 51.349999999999994}, {"state": "Assam", "urban_pop": 15.8, "rural_pop": 84.2, "urban_act": 60.75, "rural_act": 39.25, "gap": 44.95}, {"state": "Rajasthan", "urban_pop": 26.9, "rural_pop": 73.1, "urban_act": 69.97, "rural_act": 30.03, "gap": 43.07}, {"state": "West Bengal", "urban_pop": 37.63, "rural_pop": 62.37, "urban_act": 79.23, "rural_act": 20.77, "gap": 41.6}, {"state": "Sikkim", "urban_pop": 53.16, "rural_pop": 46.84, "urban_act": 14.56, "rural_act": 85.44, "gap": -38.599999999999994}, {"state": "Haryana", "urban_pop": 43.26, "rural_pop": 56.74, "urban_act": 81.54, "rural_act": 18.46, "gap": 38.28000000000001}, {"state": "Mizoram", "urban_pop": 55.52, "rural_pop": 44.48, "urban_act": 20.85, "rural_act": 79.15, "gap": -34.67}, {"state": "Jammu & Kashmir", "urban_pop": 31.05, "rural_pop": 68.95, "urban_act": 60.8, "rural_act": 39.2, "gap": 29.749999999999996}, {"state": "Maharashtra", "urban_pop": 49.07, "rural_pop": 50.93, "urban_act": 77.81, "rural_act": 22.19, "gap": 28.740000000000002}, {"state": "Nagaland", "urban_pop": 48.69, "rural_pop": 51.31, "urban_act": 21.76, "rural_act": 78.24, "gap": -26.929999999999996}, {"state": "Pondicherry", "urban_pop": 45.18, "rural_pop": 54.82, "urban_act": 23.94, "rural_act": 76.06, "gap": -21.24}, {"state": "Lakshadweep", "urban_pop": 70.47, "rural_pop": 29.53, "urban_act": 89.0, "rural_act": 11.0, "gap": 18.53}, {"state": "Punjab", "urban_pop": 42.55, "rural_pop": 57.45, "urban_act": 60.55, "rural_act": 39.45, "gap": 18.0}, {"state": "Andhra Pradesh", "urban_pop": 37.69, "rural_pop": 62.31, "urban_act": 53.96, "rural_act": 46.04, "gap": 16.270000000000003}, {"state": "Chandigarh", "urban_pop": 100.0, "rural_pop": 0.0, "urban_act": 86.25, "rural_act": 13.75, "gap": -13.75}, {"state": "Gujarat", "urban_pop": 49.71, "rural_pop": 50.29, "urban_act": 61.55, "rural_act": 38.45, "gap": 11.839999999999996}, {"state": "Goa", "urban_pop": 77.89, "rural_pop": 22.11, "urban_act": 68.0, "rural_act": 32.0, "gap": -9.89}, {"state": "Arunachal Pradesh", "urban_pop": 26.1, "rural_pop": 73.9, "urban_act": 18.0, "rural_act": 82.0, "gap": -8.100000000000001}, {"state": "Dadra & Nagar Haveli", "urban_pop": 72.26, "rural_pop": 27.74, "urban_act": 78.71, "rural_act": 21.29, "gap": 6.449999999999989}, {"state": "Himachal Pradesh", "urban_pop": 10.35, "rural_pop": 89.65, "urban_act": 8.05, "rural_act": 91.95, "gap": -2.299999999999999}, {"state": "Tripura", "urban_pop": 41.45, "rural_pop": 58.55, "urban_act": 43.31, "rural_act": 56.69, "gap": 1.8599999999999994}, {"state": "Odisha", "urban_pop": 19.19, "rural_pop": 80.81, "urban_act": 21.03, "rural_act": 78.97, "gap": 1.8399999999999999}, {"state": "Delhi", "urban_pop": 99.73, "rural_pop": 0.27, "urban_act": 100.0, "rural_act": 0.0, "gap": 0.269999999999996}];
    const container = document.getElementById('chart');

    data.forEach(d => {
        const row = document.createElement('div');
        row.className = 'row';

        // 1. State Name
        const name = document.createElement('div');
        name.className = 'state-name';
        name.textContent = d.state;
        row.appendChild(name);

        // 2. Bars
        const bars = document.createElement('div');
        bars.className = 'bars-container';

        // Projected Bar
        const projBar = document.createElement('div');
        projBar.className = 'bar-wrapper proj';
        // HTML generation for segments - need to beware of braces
        projBar.innerHTML = `
            <div class="segment urban" style="width: ${d.urban_pop}%">
                ${d.urban_pop > 15 ? d.urban_pop.toFixed(0) + '%' : ''}
            </div>
            <div class="segment rural" style="width: ${d.rural_pop}%"></div>
        `;
        bars.appendChild(projBar);

        // Actual Bar
        const actBar = document.createElement('div');
        actBar.className = 'bar-wrapper act';
        actBar.innerHTML = `
             <div class="segment urban" style="width: ${d.urban_act}%">
                ${d.urban_act > 15 ? d.urban_act.toFixed(0) + '%' : ''}
             </div>
             <div class="segment rural" style="width: ${d.rural_act}%"></div>
        `;
        bars.appendChild(actBar);

        row.appendChild(bars);

        // 3. Gap Value
        const gap = document.createElement('div');
        const diff = d.urban_act - d.urban_pop;
        const sign = diff > 0 ? '+' : '';
        gap.className = `gap-val ${diff > 0 ? 'gap-pos' : 'gap-neg'}`;
        gap.textContent = `${sign}${diff.toFixed(1)}%`;
        
        row.appendChild(gap);

        container.appendChild(row);
    });

</script>
</body>
</html>
